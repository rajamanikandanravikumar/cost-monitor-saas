{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Platform Console</title>
<link rel="stylesheet" href="{% static 'monitor/css/dashboard.css' %}"></head>
<body>
<div class="topbar"><div class="brand"><h1>Platform Console</h1><span class="sub">// superuser only</span></div></div>
<div class="card">
<table>
<tr><th>Organization</th><th>Owner</th><th>Members</th><th>Created</th></tr>
{% for entry in org_data %}
<tr>
  <td>{{ entry.organization.name }}</td>
  <td>{{ entry.owner.username|default:"—" }}</td>
  <td>{{ entry.member_count }}</td>
  <td>{{ entry.organization.created_at|date:"Y-m-d" }}</td>
</tr>
{% endfor %}
</table>
</div>
</body></html>
