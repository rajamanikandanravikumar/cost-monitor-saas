{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password — Cost Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>
<body>
  <div class="auth-box">
    <h1>Reset your password</h1>
    {% if messages %}{% for m in messages %}<div class="success-message">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <button type="submit">Send reset code</button>
    </form>
  </div>
</body>
</html>
