{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password — Cost Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>
<body>
  <div class="auth-box">
    <h1>Enter code &amp; new password</h1>
    {% if messages %}{% for m in messages %}<div class="{% if 'error' in m.tags %}error-text{% else %}success-message{% endif %}">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>6-digit code</label>
      <input type="text" name="code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
      <label>New password</label>
      <input type="password" name="password1" required>
      <label>Confirm password</label>
      <input type="password" name="password2" required>
      <button type="submit">Reset password</button>
    </form>
    <form method="post" action="{% url 'resend_reset_otp' %}" style="margin-top:12px;">
      {% csrf_token %}
      <button type="submit" style="background:none;border:none;color:var(--cyan);cursor:pointer;font-size:13px;">Resend code</button>
    </form>
  </div>
</body>
</html>
