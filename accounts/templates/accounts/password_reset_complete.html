{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<title>Password Reset Complete — Cost Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">

<body>
